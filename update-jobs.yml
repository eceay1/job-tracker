name: 채용공고 자동 업데이트
on:
  schedule:
    - cron: '0 22 * * *'   # 매일 한국시간 아침 7시
  workflow_dispatch:        # 수동 실행(=갱신 버튼)
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 라이브러리 설치
        run: pip install beautifulsoup4
      - name: 공고 크롤링 (사람인)
        run: python update_jobs_crawl.py
      - name: jobs.js 커밋 (충돌방지)
        run: |
          git config user.name "job-bot"
          git config user.email "job-bot@users.noreply.github.com"
          git add jobs.js
          git commit -m "자동 공고 업데이트 $(date +'%Y-%m-%d %H:%M')" || { echo "변경 없음"; exit 0; }
          git pull --rebase --autostash origin main || true
          git push origin main
